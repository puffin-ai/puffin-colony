# Publish a release, only when a maintainer runs it by hand (Actions > release > Run workflow) on a pushed tag v*:
# it runs the tests, builds the sdist and wheel, publishes them to PyPI with trusted publishing (no token), and
# publishes npm/ with the NPM_TOKEN secret. A pushed tag alone publishes nothing: the plugin installs from the tag on
# GitHub. The one-time setup is in docs/install.md.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The pushed tag to publish, such as v0.3.0"
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The tag matches the Python, npm and plugin versions
        env:
          TAG: ${{ inputs.tag }}
        run: |
          tag="${TAG#v}"
          python_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' colony/__init__.py)
          npm_version=$(node -p "require('./npm/package.json').version")
          plugin_version=$(node -p "require('./.claude-plugin/plugin.json').version")
          echo "tag $tag, colony/__init__.py $python_version, npm/package.json $npm_version, plugin $plugin_version"
          test "$tag" = "$python_version" && test "$tag" = "$npm_version" && test "$tag" = "$plugin_version"
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: uv run --with pytest pytest -q tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/puffin-colony/
    permissions:
      id-token: write  # trusted publishing: PyPI trusts this workflow, so no token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: pypi  # the wrapper runs `uvx puffin-colony`, so the Python package goes out first
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # for npm's provenance statement
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
