[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puffin-colony"
dynamic = ["version"]
description = "One command that runs a repo's whole software life cycle with Claude Code: a lead, builders, and a gate of checks, review and a browser walk."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
colony = "colony.cli:main"

[tool.setuptools]
packages = ["colony"]

[tool.setuptools.package-data]
colony = ["playbook.md", "colony.toml.example", "prompts/*.md", "knowledge/**/*.md", "hooks/*.py",
          "presets/**/*.md", "skills/**/*.md", "modes/*.toml"]

[tool.setuptools.dynamic]
version = { attr = "colony.__version__" }
